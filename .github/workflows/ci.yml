name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm check

      - name: Client lint and typecheck
        run: pnpm --filter @duwit-hacks/client run check

      - name: Client unit tests
        run: pnpm --filter @duwit-hacks/client run test

      - name: Client build
        run: pnpm --filter @duwit-hacks/client run build
        env:
          MAILERLITE_API_TOKEN: ci-placeholder
          MAILERLITE_GROUP_ID: ci-placeholder
